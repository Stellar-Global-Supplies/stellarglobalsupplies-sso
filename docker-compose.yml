version: '3.8'

# -------------------------------------------------------
# LOCAL DEV ONLY
# Secrets come from .env file (copy from .env.example)
# .env is gitignored — never commit it
# -------------------------------------------------------

services:
  casdoor:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env          # copy .env.example → .env and fill in values
    restart: unless-stopped