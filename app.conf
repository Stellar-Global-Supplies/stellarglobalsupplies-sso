; ============================================================
; SAFE TO COMMIT - No secrets here.
; ${PLACEHOLDERS} are replaced at container startup
; by entrypoint.sh using env vars set in Koyeb dashboard.
; ============================================================

appname = casdoor
httpport = 8000
runmode = prod
SessionOn = true
copyrequestbody = true

; Database - NeonDB PostgreSQL
; Real value injected from KOYEB env var DB_CONNECTION_STRING
driverName = postgres
dataSourceName = ${DB_CONNECTION_STRING}
dbName = casdoor

; Security
tableNamePrefix =
showSql = false

; Token
verificationCodeTimeout = 10
initScore = 2000
logPostOnly = true

; Origin - your Koyeb public domain
; Real value injected from KOYEB env var CASDOOR_ORIGIN
origin = ${CASDOOR_ORIGIN}

; Static assets CDN
staticBaseUrl = "https://cdn.casbin.org"

; Redis (optional, leave empty)
redisEndpoint =

; Storage provider (optional)
defaultStorageProvider =

isCloudIntranet = false
authState = "casdoor"
socks5Proxy = ""